<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SO Tracking (Update Header) - Khun Te</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        .nav-active { border-bottom: 4px solid #2563eb; color: #2563eb; font-weight: 600; }
        .hidden { display: none; }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 flex justify-between h-16 items-center">
            <div class="flex items-center space-x-8">
                <span class="text-xl font-bold text-blue-600">SO TRACKER</span>
                <div class="hidden md:flex space-x-6 h-16">
                    <button onclick="showPage('overview')" id="btn-overview" class="nav-active px-2 h-full">ภาพรวม</button>
                    <button onclick="showPage('all')" id="btn-all" class="px-2 h-full text-gray-500">รายการทั้งหมด</button>
                    <button onclick="showPage('notif')" id="btn-notif" class="px-2 h-full text-gray-500 relative">
                        แจ้งเตือน
                        <span id="badge-menu" class="ml-1 bg-red-500 text-white text-[10px] rounded-full h-4 w-4 flex items-center justify-center hidden">0</span>
                    </button>
                </div>
            </div>
            <button onclick="fetchData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                <i class="fas fa-sync-alt mr-2" id="loader"></i> รีเฟรชข้อมูล
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div id="page-overview" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-blue-500">
                    <p class="text-gray-400 text-xs font-bold uppercase">Total Orders</p>
                    <h3 class="text-3xl font-black mt-1" id="stat-count">0</h3>
                </div>
                <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-green-500">
                    <p class="text-gray-400 text-xs font-bold uppercase">Total Revenue</p>
                    <h3 class="text-3xl font-black text-green-600 mt-1" id="stat-revenue">฿0</h3>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border">
                <div class="px-6 py-4 bg-gray-50 border-b font-bold italic text-blue-600">
                    5 รายการล่าสุด (อิงตามเลข Quotation)
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 text-xs text-gray-500 uppercase">
                            <tr>
                                <th class="px-6 py-3 font-semibold">Quotation No</th>
                                <th class="px-6 py-3 font-semibold">ชื่อบริษัท</th>
                                <th class="px-6 py-3 font-semibold text-right">จำนวนเงิน</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-recent" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="page-all" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold">รายการทั้งหมด</h2>
                <input type="text" id="search" oninput="doSearch()" placeholder="ค้นหาเลข Quotation หรือลูกค้า..." class="border px-4 py-2 rounded-xl text-sm w-64 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden border">
                <div class="overflow-x-auto" style="max-height: 70vh;">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-800 text-white sticky top-0">
                            <tr>
                                <th class="px-6 py-4">วันที่</th>
                                <th class="px-6 py-4">Quotation No.</th>
                                <th class="px-6 py-4">ลูกค้า</th>
                                <th class="px-6 py-4 text-right">ยอดขาย</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-all" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="page-notif" class="hidden space-y-6">
            <h2 class="text-xl font-bold text-red-600"><i class="fas fa-bell mr-2"></i>รายการแจ้งเตือน</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-3">
                    <h3 class="font-bold border-b pb-2">เรือ Delay / เลยกำหนดส่ง</h3>
                    <div id="list-delay" class="space-y-2"></div>
                </div>
                <div class="space-y-3">
                    <h3 class="font-bold border-b pb-2 text-orange-600">ใกล้กำหนดส่ง (7 วัน)</h3>
                    <div id="list-near" class="space-y-2"></div>
                </div>
                <div class="space-y-3">
                    <h3 class="font-bold border-b pb-2 text-blue-600">ค้างชำระเงิน</h3>
                    <div id="list-unpaid" class="space-y-2"></div>
                </div>
                <div class="space-y-3">
                    <h3 class="font-bold border-b pb-2 text-gray-500">ค้างในระบบเกิน 30 วัน</h3>
                    <div id="list-stale" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1AK4dzFoUmK2qtRSXE0_Z3VxTCyLautz5EZb-P6jx2AI';
        const DateTime = luxon.DateTime;
        let mainData = [];

        function showPage(p) {
            ['overview', 'all', 'notif'].forEach(id => {
                document.getElementById('page-' + id).classList.add('hidden');
                document.getElementById('btn-' + id).classList.remove('nav-active');
            });
            document.getElementById('page-' + p).classList.remove('hidden');
            document.getElementById('btn-' + p).classList.add('nav-active');
        }

        async function fetchData() {
            document.getElementById('loader').classList.add('fa-spin');
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;
            
            try {
                const res = await fetch(url);
                const txt = await res.text();
                const json = JSON.parse(txt.substring(47).slice(0, -2));
                
                mainData = json.table.rows.map(row => {
                    const c = row.c;
                    return {
                        date: c[0] ? (c[0].f || c[0].v) : '-',      
                        po: c[2] ? c[2].v : '-', // ดึงจากคอลัมน์ C (Quotation No)
                        customer: c[4] ? c[4].v : '-', // ดึงจากคอลัมน์ E (ชื่อบริษัท)
                        revenue: c[7] ? (parseFloat(c[7].v) || 0) : 0, // ดึงจากคอลัมน์ H (ยอดเงิน)
                        eta: c[10] ? (c[10].f || c[10].v) : '-',   
                        payment: c[9] ? c[9].v : ''             
                    };
                }).filter(r => r.po !== '-' && r.po !== 'Quotation No.');

                renderUI();
                renderNotifications();
            } catch (e) { console.error(e); }
            finally { document.getElementById('loader').classList.remove('fa-spin'); }
        }

        function renderUI() {
            document.getElementById('stat-count').innerText = mainData.length;
            const rev = mainData.reduce((s, r) => s + r.revenue, 0);
            document.getElementById('stat-revenue').innerText = '฿' + rev.toLocaleString();
            
            const recent = [...mainData].reverse().slice(0, 5);
            document.getElementById('tbody-recent').innerHTML = recent.map(r => `
                <tr class="hover:bg-gray-50 border-b border-gray-50">
                    <td class="px-6 py-4 font-bold text-blue-600">${r.po}</td>
                    <td class="px-6 py-4">${r.customer}</td>
                    <td class="px-6 py-4 text-right font-bold">฿${r.revenue.toLocaleString()}</td>
                </tr>
            `).join('');
            renderTable(mainData);
        }

        function renderTable(data) {
            document.getElementById('tbody-all').innerHTML = data.map(r => `
                <tr class="hover:bg-blue-50">
                    <td class="px-6 py-4">${r.date}</td>
                    <td class="px-6 py-4 font-bold text-blue-700">${r.po}</td>
                    <td class="px-6 py-4">${r.customer}</td>
                    <td class="px-6 py-4 text-right font-bold text-green-600">฿${r.revenue.toLocaleString()}</td>
                </tr>
            `).join('');
        }

        function renderNotifications() {
            const today = DateTime.now();
            const lists = { delay: '', near: '', unpaid: '', stale: '' };
            let count = 0;

            mainData.forEach(r => {
                if (r.eta !== '-') {
                    const etaDate = DateTime.fromFormat(r.eta, 'd/M/yyyy');
                    if (etaDate.isValid) {
                        const diff = etaDate.diff(today, 'days').days;
                        if (diff < 0) { lists.delay += alertDiv(r, 'เลยกำหนดส่ง', 'bg-red-50 text-red-700'); count++; }
                        else if (diff <= 7) { lists.near += alertDiv(r, `ในอีก ${Math.ceil(diff)} วัน`, 'bg-orange-50 text-orange-700'); count++; }
                    }
                }
                if (String(r.payment).includes('ยังไม่ชำระ')) { lists.unpaid += alertDiv(r, 'ค้างชำระ', 'bg-blue-50 text-blue-700'); count++; }
                
                const d = DateTime.fromFormat(r.date, 'd/M/yyyy');
                if (d.isValid && today.diff(d, 'days').days > 30) { lists.stale += alertDiv(r, 'ค้างเกิน 30 วัน', 'bg-gray-50 text-gray-700'); count++; }
            });

            document.getElementById('list-delay').innerHTML = lists.delay || '<p class="text-xs text-gray-400 p-2">ไม่มีรายการ</p>';
            document.getElementById('list-near').innerHTML = lists.near || '<p class="text-xs text-gray-400 p-2">ไม่มีรายการ</p>';
            document.getElementById('list-unpaid').innerHTML = lists.unpaid || '<p class="text-xs text-gray-400 p-2">ไม่มีรายการ</p>';
            document.getElementById('list-stale').innerHTML = lists.stale || '<p class="text-xs text-gray-400 p-2">ไม่มีรายการ</p>';
            
            const badge = document.getElementById('badge-menu');
            badge.innerText = count;
            badge.classList.toggle('hidden', count === 0);
        }

        function alertDiv(r, msg, style) {
            return `<div class="p-3 rounded-lg border ${style} text-xs mb-2 shadow-sm"><b>${r.po}</b>: ${r.customer} <br> <span class="opacity-70 font-semibold">${msg}</span></div>`;
        }

        function doSearch() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = mainData.filter(r => r.customer.toLowerCase().includes(q) || r.po.toLowerCase().includes(q));
            renderTable(filtered);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
